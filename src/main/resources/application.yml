spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auditlog
    username: auditlog
    password: auditlog
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Reject unknown request fields so a caller cannot believe it supplied a sequence number,
      # ingest timestamp, or hash. Those are server-assigned.
      fail-on-unknown-properties: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

audit:
  retention:
    # Measured against recorded_at (ingest time), so a backdated occurredAt cannot keep a row hot.
    days: 365
    sweep:
      enabled: true
      cron: "0 30 3 * * *"
  security:
    pepper: ${AUDIT_SECURITY_PEPPER:dev-only-pepper-not-for-production}
    jwt:
      secret: ${AUDIT_JWT_SECRET:dev-only-hmac-secret-must-be-at-least-32-bytes!}
      ttl: 15m
      issuer: audit-log-service
    rate-limit:
      token-per-minute: 10
    api-keys:
      - client-id: ingest-service
        # plaintext (README only): als_ingest_dev_key_do_not_use_in_prod
        key-hash: 21b31abc1720e3c98203c46e412b12d8e264718a1ac0c57980df1a0672b7be85
        scopes:
          - audit.write
          - audit.read
    oauth-clients:
      - client-id: ops-admin
        # plaintext (README only): ops-admin-secret-dev
        secret-hash: 639233943e18007c5166afebd4eb75b46875214614b2799ef0633dc174a1bf05
        scopes:
          - audit.read
          - audit.admin
      - client-id: regulator
        # plaintext (README only): regulator-secret-dev
        secret-hash: 08624d1b95b24b1fd701aa9df28d739bdd6764f4518e9d2dbe0c04b95b4a188c
        scopes:
          - audit.read
          - audit.compliance

